<!--Develop a student registration webpage using HTML, CSS, and
JavaScript. Validate the user's name, email, password, gender, and
other details before submission. Use functions and events to display
validation messages.-->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="form-card">
      <div class="header">
        <h1>Student Registration</h1>
        <p>Enter your details carefully before submitting.</p>
      </div>

      <form id="registrationForm" novalidate>
        <div class="form-grid">
          <div class="form-group full">
            <label for="name">Full Name <span>*</span></label>
            <input type="text" id="name" name="name" placeholder="Enter your full name">
            <small class="error" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email Address <span>*</span></label>
            <input type="email" id="email" name="email" placeholder="example@email.com">
            <small class="error" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number <span>*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number">
            <small class="error" id="phoneError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password <span>*</span></label>
            <input type="password" id="password" name="password" placeholder="Minimum 8 characters">
            <small class="error" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span>*</span></label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
            <small class="error" id="confirmPasswordError"></small>
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth <span>*</span></label>
            <input type="date" id="dob" name="dob">
            <small class="error" id="dobError"></small>
          </div>

          <div class="form-group">
            <label>Gender <span>*</span></label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="Male"> Male</label>
              <label><input type="radio" name="gender" value="Female"> Female</label>
              <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <small class="error" id="genderError"></small>
          </div>

          <div class="form-group">
            <label for="course">Course <span>*</span></label>
            <select id="course" name="course">
              <option value="">-- Select Course --</option>
              <option>BCA</option>
              <option>BBA</option>
              <option>B.Com</option>
              <option>B.Sc</option>
              <option>BA</option>
              <option>MCA</option>
            </select>
            <small class="error" id="courseError"></small>
          </div>

          <div class="form-group">
            <label for="city">City <span>*</span></label>
            <input type="text" id="city" name="city" placeholder="Enter your city">
            <small class="error" id="cityError"></small>
          </div>

          <div class="form-group full">
            <label for="address">Address <span>*</span></label>
            <textarea id="address" name="address" rows="3" placeholder="Enter your complete address"></textarea>
            <small class="error" id="addressError"></small>
          </div>

          <div class="form-group full checkbox-group">
            <label>
              <input type="checkbox" id="terms" name="terms">
              I agree to the terms and conditions. <span>*</span>
            </label>
            <small class="error" id="termsError"></small>
          </div>
        </div>

        <button type="submit" class="submit-btn">Register Student</button>
        <button type="reset" class="reset-btn">Clear Form</button>

        <div id="successMessage" class="success-message"></div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
