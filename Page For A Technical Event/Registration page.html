<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Fest 2026 Registration</title>
</head>
<body>

    <h1 align="center">Innovation Fest 2026 Registration</h1>
    <h2 align="center">Marwadi University</h2>
    <hr>

    <h2>Registration Form</h2>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Mobile Number:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

        <label for="activity">Select Activity:</label>
        <select id="activity" name="activity">
            <option>Ideathon - Idea Presentation</option>
            <option>Hackathon - Coding Challenge</option>
            <option>Technical Quiz</option>
            <option>Project Exhibition</option>
            <option>Workshops and Guest Sessions</option>
        </select>

        <br><br>

        <input type="submit" value="Submit Registration">
    </form>

    <hr>

    <p>
        <a href="technical event page.html">Back to Event Page</a>
    </p>

</body>
</html>
