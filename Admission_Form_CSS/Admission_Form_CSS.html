<!--Design a visually attractive admission form using CSS. 
Apply the CSS box model, borders, margins, padding, text effects, 
and appropriate selectors to different form elements.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form - Marwadi University</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <h1>Admission Form</h1>
        <h2>Marwadi University - Online BCA</h2>

        <form>

            <h3 class="section-title">Personal Information</h3>

            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email address" required>

            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your mobile number" required>

            <label>Gender</label>
            <div class="option-group">

                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender">
                <label for="other">Other</label>

            </div>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>

            <h3 class="section-title">Course Information</h3>

            <label for="course">Select Course</label>

            <select id="course" required>
                <option value="">-- Select Course --</option>
                <option>Online BCA</option>
                <option>Online MCA</option>
                <option>Online BBA</option>
                <option>Online MBA</option>
            </select>

            <label>Hobbies</label>

            <div class="option-group">

                <input type="checkbox" id="coding">
                <label for="coding">Coding</label>

                <input type="checkbox" id="reading">
                <label for="reading">Reading</label>

                <input type="checkbox" id="music">
                <label for="music">Music</label>

                <input type="checkbox" id="sports">
                <label for="sports">Sports</label>
                <input type="checkbox" id="sports">
                <label for="sports">Others</label>

            </div>

            <h3 class="section-title">Address Information</h3>

            <label for="address">Full Address</label>

            <textarea id="address"
                      placeholder="Enter your complete address"
                      required></textarea>

            <div class="button-area">

                <input type="submit" value="Submit Application">

                <input type="reset" value="Clear Form">

            </div>

        </form>

        <div class="footer">
        Online Admission Form
        </div>

    </div>

</body>
</html>
