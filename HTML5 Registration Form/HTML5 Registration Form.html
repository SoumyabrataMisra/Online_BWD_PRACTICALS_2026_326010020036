
<!--Design an HTML5 registration form to collect name, email, password,
gender, date of birth, city, course, hobbies, and address. Use
appropriate HTML5 input types and form controls.-->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1 align="center">Student Registration Form</h1>
    <h2 align="center">Marwadi University - Online BCA</h2>

    <form>

        <fieldset>
            <legend><b>Personal Information</b></legend>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com" required>
            <br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password"
                   minlength="6" required>
            <br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required>
            <br><br>

            <label for="city">City:</label><br>
            <input type="text" id="city" name="city"
                   placeholder="Enter your city" required>
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Course Information</b></legend>

            <label for="course">Select Course:</label><br>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="BCA">Online BCA</option>
                <option value="MCA">Online MCA</option>
                <option value="BBA">Online BBA</option>
                <option value="MBA">Online MBA</option>
            </select>

            <br><br>

            <label>Hobbies:</label><br>

            <input type="checkbox" id="reading" name="hobbies" value="Reading">
            <label for="reading">Reading</label>

            <input type="checkbox" id="coding" name="hobbies" value="Coding">
            <label for="coding">Coding</label>

            <input type="checkbox" id="music" name="hobbies" value="Music">
            <label for="music">Music</label>

            <input type="checkbox" id="sports" name="hobbies" value="Sports">
            <label for="sports">Sports</label>
             <input type="checkbox" id="sports" name="hobbies" value="Others">
            <label for="Others">Others</label>

            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend><b>Address Information</b></legend>

            <label for="address">Full Address:</label><br>
            <textarea id="address" name="address"
                      rows="5" cols="40"
                      placeholder="Enter your complete address"
                      required></textarea>

        </fieldset>

        <br>

        <div align="center">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>

    </form>

</body>
</html>
